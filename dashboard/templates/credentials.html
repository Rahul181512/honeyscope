{% extends "base.html" %}
{% block pagetitle %}Attempted Credentials{% endblock %}
{% block content %}

<section class="grid-charts">
  <div class="panel span-2">
    <h3>Top attempted usernames &amp; passwords</h3>
    <canvas id="chartCreds" height="170"></canvas>
  </div>
</section>

<section class="panel">
  <h3>Username / password combinations</h3>
  <table class="tbl">
    <thead><tr><th>Username</th><th>Password</th><th>Attempts</th><th>Distinct sources</th></tr></thead>
    <tbody id="combosBody"><tr><td colspan="4" class="empty">Loading&hellip;</td></tr></tbody>
  </table>
</section>

{% endblock %}
